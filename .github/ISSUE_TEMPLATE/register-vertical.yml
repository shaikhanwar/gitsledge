name: Register a vertical
description: Add a vertical under an industry (taxonomy). Approver merges to publish.
title: "[Vertical] "
labels: ["register:vertical", "pending-approval"]
body:
  - type: input
    id: name
    attributes:
      label: Vertical name
    validations:
      required: true
  - type: dropdown
    id: industry
    attributes:
      label: Industry
      options:
        - State & Local Government
        - Public Safety & Justice
        - Public Health & Social Services
        - Transportation & Urban Infrastructure
        - Education
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
    validations:
      required: true
